[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobipy"
version = "0.1.0"
description = "A Python module for (local) symbolic calculus on Jacobi and Poisson manifolds"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gonçalo Oliveira", email = "g.inoc.oliveira@gmail.com" }]
keywords = ["jacobi structures", "poisson geometry", "differential geometry", "sympy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
dependencies = ["sympy>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Goncalo-math/jacobipy"
Issues = "https://github.com/Goncalo-math/jacobipy/issues"

[tool.setuptools.packages.find]
include = ["jacobipy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
